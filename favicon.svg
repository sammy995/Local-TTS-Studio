<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001E3C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0A1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="90" fill="url(#bgGradient)"/>
  
  <!-- Waveform visualization -->
  <g transform="translate(80, 256)" filter="url(#glow)" stroke="url(#waveGradient)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left side -->
    <circle cx="0" cy="0" r="8" fill="url(#waveGradient)"/>
    <line x1="0" y1="0" x2="40" y2="-40"/>
    <circle cx="40" cy="-40" r="8" fill="url(#waveGradient)"/>
    <line x1="40" y1="-40" x2="80" y2="20"/>
    <circle cx="80" cy="20" r="8" fill="url(#waveGradient)"/>
    
    <!-- Center peak -->
    <line x1="80" y1="20" x2="120" y2="-80"/>
    <circle cx="120" cy="-80" r="8" fill="url(#waveGradient)"/>
    <line x1="120" y1="-80" x2="160" y2="-20"/>
    <circle cx="160" cy="-20" r="8" fill="url(#waveGradient)"/>
    
    <!-- Right side -->
    <line x1="160" y1="-20" x2="200" y2="-60"/>
    <circle cx="200" cy="-60" r="8" fill="url(#waveGradient)"/>
    <line x1="200" y1="-60" x2="240" y2="-10"/>
    <circle cx="240" cy="-10" r="8" fill="url(#waveGradient)"/>
    <line x1="240" y1="-10" x2="280" y2="30"/>
    <circle cx="280" cy="30" r="8" fill="url(#waveGradient)"/>
    <line x1="280" y1="30" x2="320" y2="-30"/>
    <circle cx="320" cy="-30" r="8" fill="url(#waveGradient)"/>
    <line x1="320" y1="-30" x2="352" y2="0"/>
    <circle cx="352" cy="0" r="8" fill="url(#waveGradient)"/>
  </g>
  
  <!-- Sparkle accent -->
  <g transform="translate(440, 440)" fill="#60A5FA" opacity="0.8">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2"/>
  </g>
</svg>
