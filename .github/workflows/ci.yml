name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-compile:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: pip install ruff

      - name: Byte-compile all Python (syntax smoke test)
        run: python -m compileall -q core services infra runtimes run_local.py

      - name: Lint (critical errors only)
        # E9 = syntax errors, F63/F7/F82 = real bugs (undefined names, etc.)
        run: ruff check --select E9,F63,F7,F82 .
